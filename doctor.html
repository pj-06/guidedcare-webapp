<!DOCTYPE html>
<html>
<head>
    <title>Talk to Doctor</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div id="sidebar-container"></div>
<div id="topbar-container"></div>

<main class="content">

    <div class="card">

        <h3>📞 Talk to Doctor</h3>

        <p>Select a doctor and start consultation</p>

        <select id="doctorSelect" style="width:100%; padding:10px; margin-top:10px;">
            <option>Dr Sharma - General Physician</option>
            <option>Dr Mehta - Cardiologist</option>
            <option>Dr Rao - Dermatologist</option>
        </select>

        <button onclick="startConsultation()" class="btn" style="margin-top:15px;">
            Start Video Consultation
        </button>

        <hr style="margin:20px 0;">

        <h4>📝 Consultation Notes</h4>

        <textarea 
            id="consultationNotes"
            placeholder="Enter doctor's advice..."
            style="width:100%; height:100px; padding:10px;">
        </textarea>

        <button onclick="generateSummary()" class="btn" style="margin-top:10px;">
            Generate AI Summary
        </button>

        <div id="summaryOutput" style="margin-top:15px;"></div>

    </div>

</main>

<!-- LOAD SIDEBAR + TOPBAR -->
<script>
Promise.all([
    fetch('topmenu.html').then(res => res.text()),
    fetch('sidebar.html').then(res => res.text())
])
.then(([topbarData, sidebarData]) => {

    document.getElementById('topbar-container').innerHTML = topbarData;
    document.getElementById('sidebar-container').innerHTML = sidebarData;

    initScrollBehavior();
    checkAuth();
});
</script>

<script src="script.js"></script>
<script src="chat.js"></script>

</body>
</html>
