<!DOCTYPE html>
<html>
<head>
    <title>AI Medical Chat</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div id="sidebar-container"></div>
<div id="topbar-container"></div>

<main class="content">

    <div class="card">

        <h3>🤖 AI Medical Chat</h3>

        <p style="color:red; font-size:14px;">
            ⚠️ This chatbot provides general guidance only and is not a substitute for professional medical advice.
        </p>

        <div id="chatbox" 
            style="height:300px; overflow-y:auto; border:1px solid #ccc; padding:10px; margin-top:10px;">
        </div>

        <div style="margin-top:10px; display:flex; gap:10px;">
            <input 
                type="text"
                id="userInput"
                placeholder="Ask about your symptoms..."
                style="flex:1; padding:10px; border-radius:6px; border:1px solid #ccc;"
            >

            <button onclick="sendMessage()" class="btn">
                Send
            </button>
        </div>

    </div>

</main>

<!-- LOAD SIDEBAR + TOPBAR -->
<script>
Promise.all([
    fetch('topmenu.html').then(res => res.text()),
    fetch('sidebar.html').then(res => res.text())
])
.then(([topbarData, sidebarData]) => {

    document.getElementById('topbar-container').innerHTML = topbarData;
    document.getElementById('sidebar-container').innerHTML = sidebarData;

    initScrollBehavior();
    checkAuth();
});
</script>

<script src="script.js"></script>
<script src="chat.js"></script>

</body>
</html>
