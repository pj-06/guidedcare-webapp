<!DOCTYPE html>
<html>
<head>
    <title>Medicine Tracker</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>
</head>

<body>

<div class="container">

    <h1>💊 Medicine Tracker</h1>

    <div class="card">
        <h2>Add Medicine</h2>

        <input class="input" id="name" placeholder="Medicine Name">

        <input class="input" id="days" type="number" placeholder="Number of Days">

        <label>Times per Day</label>
        <select class="input" id="timesPerDay">
            <option value="1">Once</option>
            <option value="2">Twice</option>
            <option value="3">Thrice</option>
        </select>

        <div id="timeInputs"></div>

        <button class="btn" id="addMedBtn">Add Medicine</button>
    </div>

    <div class="card">
        <h2>Your Schedule</h2>
        <div id="medicineList"></div>
    </div>

    <button class="btn" onclick="showSummary()">View Summary</button>

</div>

<script src="medicine.js"></script>

</body>
</html>
