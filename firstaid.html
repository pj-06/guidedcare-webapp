<!DOCTYPE html>

<html>
<head>
    <title>First Aid Assistant</title>

```
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

<!-- Same font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
```

</head>

<body>

<!-- Topbar -->

<div id="topbar-container"></div>

<div class="layout">

```
<!-- Sidebar -->
<div id="sidebar-container"></div>

<main class="content">

    <!-- Header Card -->
    <div class="card" style="background:#e6f4f7;border-left:6px solid #0e4d64;">
        <h2>🚑 First Aid Assistant</h2>
        <p>Select a situation to get immediate help</p>
    </div>

    <!-- Emergency Options -->
    <div class="card">
        <h2>Choose Situation</h2>

        <div class="card-grid">
            <div class="card" onclick="startCase('bleeding')">🩸 Bleeding</div>
            <div class="card" onclick="startCase('burn')">🔥 Burn</div>
            <div class="card" onclick="startCase('fracture')">🦴 Fracture</div>
            <div class="card" onclick="startCase('unconscious')">😵 Unconscious</div>
            <div class="card" onclick="startCase('choking')">😷 Choking</div>
        </div>
    </div>

    <!-- Questions -->
     <!-- <div class="card hidden" id="assessmentCard"></div> -->
    <div class="card" id="assessmentCard" style="display: none;">
    <h2>Assessment</h2>
    <div id="questionBox"></div>
</div>

    <!-- Guide Output -->
    <div class="card">
        <h2>Guidance</h2>
        <div id="guideBox" class="guide-card"></div>
    </div>

</main>
```

</div>

<!-- Load Topbar + Sidebar -->

<script>
Promise.all([
    fetch('topmenu.html').then(res => res.text()),
    fetch('sidebar.html').then(res => res.text())
])
.then(([topbarData, sidebarData]) => {

    document.getElementById('topbar-container').innerHTML = topbarData;
    document.getElementById('sidebar-container').innerHTML = sidebarData;

    initScrollBehavior();

    if (typeof checkAuth === "function") checkAuth();
});
</script>

<script src="firstaid.js"></script>

</body>
</html>
