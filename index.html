<!DOCTYPE html>
<html>
<head>
    <title>GuidedCare Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>
    
    <script>
document.addEventListener("DOMContentLoaded", async () => {

    const { data: members } = await supabaseClient
        .from("family_members")
        .select("*");

    const { data: records } = await supabaseClient
        .from("health_records")
        .select("*");

    document.getElementById("memberCount").innerText = members.length;
    document.getElementById("recordCount").innerText = records.length;

});
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

        <div id="sidebar-container"></div>
  
<div id="topbar-container"></div>
    <main class="content">
    <h2>🏥 Healthcare Dashboard</h2>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:30px;">
        
        <div class="card">
            <h3>👨‍👩‍👧 Total Family Members</h3>
            <p id="memberCount" style="font-size:24px;font-weight:bold;">0</p>
        </div>

        <div class="card">
            <h3>🩺 Total Medical Records</h3>
            <p id="recordCount" style="font-size:24px;font-weight:bold;">0</p>
        </div>

    </div>
    <!-- 🤖 AI Chat Section -->
<div id="chatSection" class="card" style="display:none; margin-top:30px;">

    <h3>🤖 AI Medical Chat</h3>

    <p style="color:red; font-size:14px;">
        ⚠️ This chatbot provides general guidance only and is not a substitute for professional medical advice.
    </p>

    <div id="chatbox" style="height:300px; overflow-y:auto; border:1px solid #ccc; padding:10px; margin-top:10px;"></div>

    <div style="margin-top:10px; display:flex; gap:10px;">
        <input 
            type="text" 
            id="userInput" 
            placeholder="Ask about your symptoms..." 
            style="flex:1; padding:10px; border-radius:6px; border:1px solid #ccc;"
        >

        <button onclick="sendMessage()" class="btn">
            Send
        </button>
    </div>

</div>
</main>
<script>
Promise.all([
    fetch('topmenu.html').then(res => res.text()),
    fetch('sidebar.html').then(res => res.text())
])
.then(([topbarData, sidebarData]) => {

    document.getElementById('topbar-container').innerHTML = topbarData;
    document.getElementById('sidebar-container').innerHTML = sidebarData;

    // AFTER injection initialize behavior
    initScrollBehavior();

    // Run page functions here
    checkAuth();
    loadFamily();
});
</script>

<script src="script.js"></script>
<script src="chat.js"></script>
</body>
</html>
